:root{--bg:#08070d;--panel:#15111d;--panel2:#1d1728;--line:#392d49;--txt:#f8f3ea;--muted:#b8aec5;--gold:#f3c95e;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#341c3b 0,#100b16 35%,#08070d 76%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

h1{font-family:Georgia,serif;margin:0;font-size:clamp(25px,4vw,40px)} .sub{color:var(--muted);margin-top:4px}
.controls{display:grid;grid-template-columns:minmax(220px,1fr) 230px 180px;gap:8px;margin-top:15px}
input,select{width:100%;padding:12px 13px;background:#110d17;color:white;border:1px solid #4b395e;border-radius:11px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
main{max-width:1500px;margin:auto;padding:22px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:10px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.24)}
.head{display:flex;justify-content:space-between;align-items:center;gap:7px;padding:6px 8px;border-bottom:1px solid var(--line)}
.exp{font-size:12px;color:var(--muted);font-weight:700} .kind{font-size:11px;background:#2c2139;border-radius:999px;padding:4px 7px}
.combo{display:flex;align-items:flex-start;justify-content:center;gap:clamp(2px,.5vw,5px);padding:7px 5px 6px;width:100%;overflow:hidden}
.item{flex:1 1 0;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.iconFrame{width:clamp(32px,4vw,48px);height:clamp(32px,4vw,48px);max-width:100%;aspect-ratio:1;background:#0b0910;border:1px solid #4a3a58;border-radius:11px;display:grid;place-items:center;overflow:hidden}
.sprite{width:88%;height:88%;display:block;background-position:center;background-repeat:no-repeat;background-size:contain;image-rendering:pixelated}.realImg{width:88%;height:88%;object-fit:contain;image-rendering:pixelated}
.item.passive .iconFrame{border-color:#357d64} .item.result .iconFrame{border-color:#927229;box-shadow:0 0 18px rgba(243,201,94,.12)}
.name{font-size:8px;font-weight:750;line-height:1.12;margin-top:5px;overflow-wrap:anywhere;max-width:100%} .result .name{color:var(--gold)}
.op{flex:0 0 auto;align-self:center;font-family:Georgia,serif;font-size:clamp(13px,1.8vw,17px);font-weight:900;color:var(--gold);margin-top:-14px}
.meta{padding:0 8px 7px;color:var(--muted);font-size:9px} .meta b{color:#eee6f4}
.note{margin-top:6px;padding:6px 8px;border:1px solid #30263a;background:#0e0b13;border-radius:8px}

.empty{display:none;text-align:center;color:var(--muted);padding:55px}

.combo::-webkit-scrollbar{display:none}

.combo.n4 .iconFrame{width:41px;height:41px} .combo.n5 .iconFrame{width:37px;height:37px}
.combo.n6 .iconFrame,.combo.n7 .iconFrame{width:29px;height:29px}
.combo.n5 .name,.combo.n6 .name,.combo.n7 .name{font-size:9px}
@media(max-width:650px){

const penshinAtlas={"Tonno Subito": {"x": 283, "y": 298, "w": 16, "h": 16}, "Tonnado": {"x": 302, "y": 292, "w": 16, "h": 16}, "Tonn’omoto": {"x": 264, "y": 298, "w": 16, "h": 16}, "Tonn’oddeeo": {"x": 245, "y": 308, "w": 16, "h": 16}, "Tonne": {"x": 359, "y": 275, "w": 16, "h": 16}, "Unsurpassed": {"x": 276, "y": 497, "w": 16, "h": 13}};
const penshinAtlasUrl="https://cdn.jsdelivr.net/gh/RollingK0824/WinAPI-Coop-Survivor@main/WinAPI-Coop-Survivor/Resources/Texture/tps_lossless_icons.png";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const exps=[...new Set(recipes.map(x=>x.expansion))];
exps.forEach(x=>{let o=document.createElement('option');o.value=o.textContent=x;$('#exp').appendChild(o)});

const kindLabels={Evolution:'Evoluzione',Union:'Unione',Gift:'Dono',Morph:'Trasformazione'};
function kindLabel(k){return kindLabels[k]||k}
function levelLabel(s){return String(s||'').replace(/\bLv\b/g,'Liv.')}
function isCondition(s){return /passive|evoluzioni|livello massimo|automatico|consumato|richiede|stessa partita|livello 80/i.test(s||'')}
function splitPlus(s){return (s||'').split(/\s+\+\s+/).map(x=>x.trim()).filter(Boolean)}
function item(n,cls='weapon'){
 const direct=directImages[n];
 const ic=classOverrides[n]||icons[n];
 const attrs=`data-item="${esc(n)}" role="button" tabindex="0" aria-label="Mostra tutte le combinazioni con ${esc(n)}"`;
 if(direct){
   if(ic){
     return `<div class="item ${cls}" ${attrs}><div class="iconFrame"><img class="realImg" src="${direct}" alt="${esc(n)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'"><span class="sprite ${esc(ic)}" style="display:none"></span></div><div class="name">${esc(n)}</div></div>`;
   }
   return `<div class="item ${cls}" ${attrs}><div class="iconFrame"><img class="realImg" src="${direct}" alt="${esc(n)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none;font-size:22px;color:#746882">✦</span></div><div class="name">${esc(n)}</div></div>`;
 }
 if(!ic) return `<div class="item ${cls}" ${attrs}><div class="iconFrame"><span style="font-size:22px;color:#746882">✦</span></div><div class="name">${esc(n)}</div></div>`;
 return `<div class="item ${cls}" ${attrs}><div class="iconFrame"><span class="sprite ${esc(ic)}"></span></div><div class="name">${esc(n)}</div></div>`;
}
function cond(n){return `<div class="condition"><div class="conditionBox">${esc(n)}</div></div>`}
function atlasIcon(name,meta){
 const scale=42/16;
 const bgW=512*scale, bgH=512*scale;
 const posX=-(meta.x*scale), posY=-(meta.y*scale);
 const drawH=meta.h*scale;
 const yPad=(42-drawH)/2;
 return `<div class="miniForm"><div class="miniIcon"><span class="atlasSprite" style="width:42px;height:${drawH}px;margin-top:${yPad}px;background-image:url('${penshinAtlasUrl}');background-size:${bgW}px ${bgH}px;background-position:${posX}px ${posY}px"></span></div><div class="miniName">${esc(name)}</div></div>`;
}
function combo(r){
 if(r.base==='Penshin Fatcha' && r.result.includes('Tonno Subito')){
   const forms=Object.entries(penshinAtlas).map(([name,meta])=>atlasIcon(name,meta)).join('');
   return `<div class="combo penshinSpecial">${item('Penshin Fatcha','weapon')}<div class="op">=</div><div class="formsGrid">${forms}</div></div>`;
 }
 let parts=[]; splitPlus(r.base).forEach(x=>parts.push({type:'item',name:x,cls:'weapon'}));
 if(r.catalyst){
   if(isCondition(r.catalyst)) parts.push({type:'cond',name:r.catalyst});
   else splitPlus(r.catalyst).forEach(x=>parts.push({type:'item',name:x,cls:'passive'}));
 }
 parts.push({type:'item',name:r.result,cls:'result'});
 let h=''; parts.forEach((p,i)=>{if(i)h+=`<div class="op">${i===parts.length-1?'=':'+'}</div>`;h+=p.type==='cond'?cond(p.name):item(p.name,p.cls)});
 return `<div class="combo n${Math.min(parts.length,7)}">${h}</div>`;
}
function render(){
 const q=$('#q').value.toLowerCase().trim(),e=$('#exp').value,k=$('#kind').value;
 const list=recipes.filter(r=>(!e||r.expansion===e)&&(!k||r.kind===k)&&(!q||[r.result,r.base,r.catalyst,r.note,r.expansion].join(' ').toLowerCase().includes(q)));
 $('#grid').innerHTML=list.map(r=>`<article class="card"><div class="head"><span class="exp">${esc(r.expansion)}</span><span class="kind">${esc(kindLabel(r.kind))}</span></div>${combo(r)}<div class="meta">${r.level?`<div><b>Livello:</b> ${esc(levelLabel(r.level))}</div>`:''}${r.catalyst?`<div><b>Passiva/requisito:</b> ${esc(r.catalyst)}</div>`:''}${r.note?`<div class="note">${esc(r.note)}</div>`:''}</div></article>`).join('');
 $('#count').textContent=list.length;$('#empty').style.display=list.length?'none':'block';
}

function recipeHasItem(r,name){
 const bases=splitPlus(r.base);
 const catalysts=isCondition(r.catalyst)?[]:splitPlus(r.catalyst);
 return bases.includes(name)||catalysts.includes(name)||r.result===name;
}
function relatedCard(r){
 return `<article class="card"><div class="head"><span class="exp">${esc(r.expansion)}</span><span class="kind">${esc(kindLabel(r.kind))}</span></div>${combo(r)}<div class="meta">${r.level?`<div><b>Livello:</b> ${esc(levelLabel(r.level))}</div>`:''}${r.catalyst?`<div><b>Passiva/requisito:</b> ${esc(r.catalyst)}</div>`:''}${r.note?`<div class="note">${esc(r.note)}</div>`:''}</div></article>`;
}
function openComboMenu(name){
 const related=recipes.filter(r=>recipeHasItem(r,name));
 $('#comboModalTitle').textContent=name;
 $('#comboModalSub').textContent=related.length===1?'1 combinazione collegata':`${related.length} combinazioni collegate`;
 $('#comboModalBody').innerHTML=related.length?`<div class="relatedGrid">${related.map(relatedCard).join('')}</div>`:'<div class="relatedEmpty">Nessuna combinazione collegata trovata.</div>';
 $('#comboModal').classList.add('open');
 $('#comboModal').setAttribute('aria-hidden','false');
 document.body.style.overflow='hidden';
}
function closeComboMenu(){
 $('#comboModal').classList.remove('open');
 $('#comboModal').setAttribute('aria-hidden','true');
 document.body.style.overflow='';
}
document.addEventListener('click',e=>{
 const itemEl=e.target.closest('.item[data-item]');
 if(itemEl){openComboMenu(itemEl.dataset.item);return}
 if(e.target.id==='comboModal'||e.target.closest('#comboClose')) closeComboMenu();
});
document.addEventListener('keydown',e=>{
 const itemEl=e.target.closest&&e.target.closest('.item[data-item]');
 if(itemEl&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openComboMenu(itemEl.dataset.item);return}
 if(e.key==='Escape'&&$('#comboModal').classList.contains('open')) closeComboMenu();
});
['q','exp','kind'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));render();
</script>
</body></html>
